name: Watch

on:
    schedule:
        - cron: '23 5 * * *'
    workflow_dispatch:

permissions:
    contents: read
    pages: read

jobs:
    watch:
        name: Compare the public address with the site branch and the release
        if: ${{ github.repository == 'streamyfin/streamyfin-cast' }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  sparse-checkout: scripts
                  persist-credentials: false

            - name: Checkout the site branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: site
                  path: site
                  persist-credentials: false

            # What is online must be the site branch, and the release channel must be its published zip.
            - name: Compare
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  bash scripts/verify-served.sh "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)" site 1
                  if [ -f site/release/version.json ]; then
                      version=$(jq -r .version site/release/version.json)
                      gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern 'streamyfin-cast-*.zip' --dir zip
                      unzip -q zip/*.zip -d unzipped
                      diff -r unzipped site/release
                  fi
